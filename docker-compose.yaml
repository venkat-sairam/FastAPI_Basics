services:

  redis:
    image: redis:7
    container_name: sentinel_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mynetwork
    command: ["redis-server", "--appendonly", "yes"]

  db:
    image: postgres:14
    container_name: sentinel_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sentinel_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - mynetwork
  pgadmin:
    image: dpage/pgadmin4
    container_name: sentinel_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sentinel.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      - db
    networks:
      - mynetwork



  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel_api
    environment:
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
      - db
    volumes:
      - ./src:/app/src
      - ./test:/app/test
    command: ["wait-for-it.sh", "db", "5432", "--", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

    networks:
      - mynetwork
  ui:
    build:
      context: .
      dockerfile: streamlit_app/Dockerfile
    container_name: sentinel_ui
    volumes:
      - ./streamlit_app:/ui
    ports:
      - "8501:8501"
    depends_on:
      - api
    networks:
      - mynetwork

volumes:
  redis_data:
  db_data:
  streamlit_app:

networks:
  mynetwork:
    driver: bridge
